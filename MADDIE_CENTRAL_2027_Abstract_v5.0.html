<title>MADDIE CENTRAL | 2027 — Abstract Edition</title>
<style>

for(let k=0;k<cnt;k++){const e=L?P[k]:P.filter(p=>p.dept===d)[k],a=k*2.399,rr=(L?15:13)*Math.sqrt(k+1)*(L?.92:1)*(L?1:1.12),px=(S/2+Math.cos(a)*rr).toFixed(1),py=(S/2-10+Math.sin(a)*rr).toFixed(1);o+=mini?`<circle cx="${px}" cy="${py}" r="6" fill="${e&&e.head?CREAM:L?DC[dIdx(e.dept)]:c}" stroke="${INK}" stroke-width="2"/>`:`<circle class="emp" data-emp="${e.i}" tabindex="-1" cx="${px}" cy="${py}" r="${e.head?8.5:6.5}" fill="${e.head?CREAM:L?DC[dIdx(e.dept)]:c}" stroke="${INK}" stroke-width="2.2"><title>${esc(e.name)} · ${esc(e.role)}</title></circle>`}
o+=`</g><text x="22" y="${S-34}" font-family="inherit" font-weight="850" font-size="${Math.min(28,Math.floor(226/(lab.length*.56)))}" letter-spacing="-1.2" fill="${INK}" stroke="${CREAM}" stroke-width="6" paint-order="stroke">${esc(lab)}</text><text x="22" y="${S-14}" font-family="inherit" font-weight="650" font-size="14" fill="${INK}" stroke="${CREAM}" stroke-width="4" paint-order="stroke">${cnt} people</text></g>`});return o+'</svg>'}
function office(){return `<div class="wrap ofc"><div class="ofhead"><div><div class="eb">Interactive feature</div><h1>The abstract office.</h1><p>Eight divisions, one lobby, fifty-one dots. Hover a room to lift it, click a room to enter it, click a dot to meet a person.</p></div><div class="btns"><a class="btn2" href="#home">← Back to reports</a><button class="btn" data-a="shuffle">Recompose ↻</button></div></div><div class="ofbox">${officeSvg(false)}</div><div class="olegend"><span><i style="background:${CREAM}"></i>Large dot = division head</span><span><i style="background:${PAL[0]}"></i>Colour = division</span><span>Everything here is fictional and read-only.</span></div><div class="dlist">${D.map((d,j)=>`<button class="dli" data-div="${esc(d)}">${glyph(j,40)}<span><b>${esc(d)}</b><small>${counts[d]} people</small></span></button>`).join('')}</div></div>`}

let route_='home',pres=false,lastF=null;

$('#ft').innerHTML=`<div class="wrap"><div class="fcols"><div><b>MADDIE CENTRAL | 2027</b>People & Culture — abstract edition. A fictional, read-only presentation prototype.</div><div><b>Reports</b>${CATS.slice(0,3).map((c,i)=>`<a href="${url(i)}">${esc(c.name)}</a>`).join('')}</div><div><b>&nbsp;</b>${CATS.slice(3,6).map((c,i)=>`<a href="${url(i+3)}">${esc(c.name)}</a>`).join('')}</div><div><b>Explore</b><a href="${url(8)}">Executive scoreboard</a><a href="#office">Abstract office</a><a href="#home">Back to top ↑</a></div></div><p>All people, figures, activity records and decisions shown are synthetic examples. Nothing here represents real payroll, case files or live HR records.</p></div>`}
function reveal(){const els=$$('.rv');if(RM||!('IntersectionObserver'in window)){els.forEach(e=>e.classList.add('in'));$$('[data-len]').forEach(e=>e.style.setProperty('--len',e.dataset.len));$$('[data-c]').forEach(e=>e.textContent=e.dataset.c);return}
const io=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){const t=x.target;t.classList.add('in');$$('[data-len]',t).forEach(e=>e.style.setProperty('--len',e.dataset.len));$$('[data-c]',t).forEach(e=>count(e));io.unobserve(t)}}),{threshold:.15});els.forEach(e=>io.observe(e));setTimeout(()=>els.forEach(e=>e.classList.add('in')),4000)}
function count(e){const to=+e.dataset.c,s=performance.now();const f=t=>{const p=Math.min(1,(t-s)/900);e.textContent=Math.round(to*(1-Math.pow(1-p,3)));p<1&&requestAnimationFrame(f)};requestAnimationFrame(f)}

route_=h;document.title=t+' — MADDIE CENTRAL | 2027';$$('[data-n]').forEach(a=>a.classList.toggle('cur',a.dataset.n===h));scrollTo({top:0,behavior:'instant'});reveal();updP()}

$('#sr').innerHTML=h.slice(0,24).map(x=>x[0]==='a'?`<a href="${x[1]}">${x[4]}<span>${esc(x[2])}<small>${esc(x[3])}</small></span></a>`:`<button data-p="${x[1]}">${x[4]}<span>${esc(x[2])}<small>${esc(x[3])}</small></span></button>`).join('')||'<p style="color:var(--mut);font-size:13px">No matches.</p>'}
function csv(){const l=list(),t=[AC.map(a=>a[1]).join(','),...l.map(r=>AC.map(([k])=>'"'+String(gv(r,k)??'').replaceAll('"','""')+'"').join(','))].join('\r\n'),u=URL.createObjectURL(new Blob([t],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=u;a.download=`maddie_demo_${ids[CI]}_${SI}.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
